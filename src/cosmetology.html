<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Косметология в студии «Шёлк» в Барнауле. Запись онлайн.">
    <title>Косметология | Студия "Шёлк"</title>


    <link rel="stylesheet" href="./styles/index.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<body class="flow lazer-page price-page">
    <header class="flex main-header">
        <div class="flex">

        </div>

        <div class="flow flow--space-small">
            <h1 class="uppercase fs-900">Студия эстетики тела</h1>
            <img src="./assets/logo.svg" alt="Логотип студии Шёлк">
            <p class="lowercase">Всё будет гладко</p>
        </div>
    </header>

<main class="pricelist flow">
    <div class="pricelist-title has-lavender">
        <h2>Косметология</h2>
    </div>
    <div class="breadcrumb">
        <a href="index.html" class="back-link">На главную</a>
    </div>

    <!-- Только акция -->
    <div class="promotions-zone pricelist-zone" data-collapsed="true">
        <button type="button" class="pricelist-heading" aria-expanded="false">
            <h3>Акция студии</h3>
            <span class="arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </button>
        <div class="pricelist-items">
            <ul class="promo-list promo-list--single">
                <li>
                    <span class="promo-icon"><img src="./assets/icons/icon-gift.svg" alt=""></span>
                    <div>Абонемент на 10 посещений - <strong>скидка 10%</strong></div>
                </li>
            </ul>
        </div>
    </div>

    <!-- Таблица цен -->
    <div class="price-table">
        <!-- ... -->
    </div>
