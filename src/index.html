<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Студия Шёлк | главная </title>

    <link rel="stylesheet" href="./styles/index.css">
</head>

<body class="flow">
    <header class="flex main-header">
        <div class="flex">
            .
        </div>
        <div flex>
            <h1 class="uppercase">Студия эстетики тела</h1>
            <img src="./assets/logo.svg" alt="Логотип студии Шёлк">
            <p class="lowercase">Всё будет гладко</p>
        </div>
    </header>

    <main class="grid grid-container grid-container--home flow">
        <section class="images-wrapper" aria-label="Фотографии интерьера студии">

            <div class="images-carousel flex">
                <img src="./assets/home-images/studio-photo.png" alt="">
                <img src="./assets/home-images/studio-photo.png" alt="">
                <img src="./assets/home-images/studio-photo.png" alt="">
            </div>

            <div class="carousel-controls dot-indicators" role="tablist" aria-label="Выберите слайд">
                <button role="tab" aria-selected="true"><span class="sr-only">1</span></button>
                <button role="tab" aria-selected="false"><span class="sr-only">2</span></button>
                <button role="tab" aria-selected="false"><span class="sr-only">3</span></button>
            </div>
        </section>

        <section class="about flex">
            <div>
                <h2 class="uppercase">О студии</h2>
                <p>Шёлк - студия эстетики тела в Барнауле. ⌂ Мы работаем по адресу: (...)</p>
            </div>
            <button type="button" class="btn-appointment">Записаться</button>
        </section>
        
        <section class="services flow">
            <h2 class="uppercase">Услуги студии</h2>

            <div class="services-wrapper flex">
                <div class="services__card">
                    <p class="service-name flex">Лазерная эпиляция (женщинам)</p>
                    
                    <div>
                    <img src="./assets/services-images/img-lazer.png" alt="">
                    </div>
                </div>
                <div class="services__card">
                    <p class="service-name flex">Лазерная эпиляция (мужчинам)</p>
                    
                    <div>
                    <img src="./assets/services-images/img-lazer-male.png" alt="">
                    </div>
                </div>            
                <div class="services__card">
                    <p class="service-name flex">Косметология</p>
                    
                    <div>
                    <img src="./assets/services-images/img-cosm.png" alt="">
                    </div>
                </div>
                <div class="services__card">
                    <p class="service-name flex">Аппаратная коррекция фигуры</p>
                    
                    <div>
                    <img src="./assets/services-images/img-figure.png" alt="">
                    </div>
                </div>
                        
            </div>
        </section>
        
        <section class="reviews grid">
            <h2 class="uppercase">Отзывы</h2>
            <div class="reviews-carousel flex">
                <div></div>
                <div></div>
                <div></div>
            </div>

            <div class="reviews-controls dot-indicators" role="tablist" aria-label="Выберите слайд">
                <button role="tab" aria-selected="true"><span class="sr-only">1</span></button>
                <button role="tab" aria-selected="false"><span class="sr-only">2</span></button>
                <button role="tab" aria-selected="false"><span class="sr-only">3</span></button>
            </div>
        </section>

        <section class="tech">
        <h2 class="uppercase">Оборудование</h2>
        </section>

        <section class="contacts">
        <h2 class="uppercase">Контакты</h2>
        </section>

    </main>

    <footer>

    </footer>
</body>
</html>
